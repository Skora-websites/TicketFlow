name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # --legacy-peer-deps is required: next-auth v5 beta declares a nodemailer
          # peer range that conflicts with the installed nodemailer major.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck + regression tests
        run: npm test

      - name: Lint
        run: npm run lint
